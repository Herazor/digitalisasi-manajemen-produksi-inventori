services:
  postgres:
    image: postgres:18
    container_name: production_inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: production_demo
      POSTGRES_DB: production_inventory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: